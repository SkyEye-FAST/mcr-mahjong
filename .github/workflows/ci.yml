name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, regression and public ABI checks
        run: ./gradlew build
      - name: Publish tested Maven artifacts locally
        run: ./gradlew publishToMavenLocal
      - name: Verify Java POM and Kotlin module consumers
        run: ./gradlew -p consumers clean verify
